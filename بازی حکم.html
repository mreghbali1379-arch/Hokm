<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بازی حکم</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ea;--tx:#1d1d1b;--felt:#1f6b47}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a18;--tx:#eee}}
:root[data-theme="dark"]{--bg:#171a18;--tx:#eee}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Vazirmatn,system-ui,sans-serif;padding:8px;max-width:520px;margin-inline:auto}
.top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;gap:6px;flex-wrap:wrap}
.top b{font-size:15px}
.table{background:var(--felt);border-radius:16px;padding:8px;display:grid;grid-template-columns:1fr 2fr 1fr;grid-template-rows:auto 160px auto;gap:4px;color:#fff;text-align:center}
.pl{font-size:12px;opacity:.95}.pl.act{color:#ffe36b;font-weight:bold}
.n{font-size:11px;background:#0003;border-radius:8px;padding:2px 6px;display:inline-block}
.mid{grid-column:2;grid-row:2;position:relative}
.slot{position:absolute}
.s0{bottom:0;left:50%;transform:translateX(-50%)}.s2{top:0;left:50%;transform:translateX(-50%)}
.s1{top:50%;right:0;transform:translateY(-50%)}.s3{top:50%;left:0;transform:translateY(-50%)}
.card{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:50px;height:74px;background:#fff;color:#111;border-radius:7px;border:1px solid #999;font-size:14px;font-weight:bold;line-height:1.15;font-family:Tahoma,sans-serif}.card .sn{font-size:9px;font-weight:normal}.card .sy{font-size:18px}
.card.r{color:#c4161c}
.back{background:repeating-linear-gradient(45deg,#2c4a9a,#2c4a9a 4px,#3a5cb8 4px,#3a5cb8 8px);border:2px solid #fff;width:22px;height:32px;margin:0 -6px;border-radius:4px;display:inline-block}
.hand{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:10px}
button.card{cursor:pointer;opacity:.45;padding:0}
button.card.ok{opacity:1;box-shadow:0 0 0 2px #ffd34d}
.msg{min-height:44px;text-align:center;margin:8px 0;font-size:14px}
.btn{background:#1f6b47;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer;margin:2px;font-family:inherit}
.pick{text-align:center}
.pick .btn{font-size:24px;background:#fff;color:#111;min-width:72px}
.pick .btn.r{color:#c4161c}
.col2{display:flex;flex-direction:column;align-items:center;justify-content:center}
.slot .card{animation:pop .25s}@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}.slot.win .card{box-shadow:0 0 0 3px #ffd34d}button.card{transition:transform .12s}button.card.ok:hover{transform:translateY(-6px)}.mini{padding:4px 10px;font-size:13px}#log{max-height:140px;overflow-y:auto;font-size:13px;background:#0001;border-radius:8px;padding:6px;margin:6px 0}#log div{margin:3px 0}</style>
</head>
<body>
<div class="top">
<div>حکم: <b id="tr">—</b></div>
<div>حاکم: <b id="hk">—</b></div>
<div>دست: شما+یار <b id="sc0">0</b> | حریف <b id="sc1">0</b> (تا ۷؛ کوت = ۲، حاکم‌کوت = ۳)</div>
<div>این دست: <b id="tk0">0</b> - <b id="tk1">0</b></div>
<div><button class="btn mini" onclick="if(confirm('بازی جدید؟')){sc=[0,0];newHand()}">بازی جدید</button></div>
</div>
<div class="table">
<div style="grid-column:2;grid-row:1" class="pl" id="p2"></div>
<div style="grid-column:1;grid-row:2" class="col2 pl" id="p3"></div>
<div class="mid" id="mid" aria-hidden="true"></div>
<div style="grid-column:3;grid-row:2" class="col2 pl" id="p1"></div>
<div style="grid-column:2;grid-row:3" class="pl" id="p0"></div>
</div>
<div class="msg" id="msg"></div>
<div id="ctl" style="text-align:center"></div>
<div style="text-align:center"><button class="btn mini" onclick="readTable()">کارت‌های بازی‌شده در این دست</button></div>
<div id="log" role="log" aria-live="polite" aria-label="گزارش بازی"></div>
<div class="hand" id="hand"></div>
<script>
const SU=['♠','♥','♦','♣'],RL={11:'J',12:'Q',13:'K',14:'A'},NM=['شما','بهرام','نسترن (یار)','مهسا'];
let H,trump,hakem=Math.floor(Math.random()*4),turn,trick,tk,sc=[0,0],phase,busy=false,deck,seen=new Set(),voids=[new Set(),new Set(),new Set(),new Set()],lastTrick=[],shown=[],plays=[],waiting=false,winSeat=-1;
const $=id=>document.getElementById(id);
const SN=['پیک','دل','خشت','گشنیز'],RN={11:'سرباز',12:'بی‌بی',13:'شاه',14:'آس'},fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const lab=c=>RN[c.r]||fa(c.r);
const val=c=>c.r+(c.s===trump?100:0);
function beats(c,b){return c.s===b.s?c.r>b.r:c.s===trump}
function bestOf(t){let b=t[0];for(const x of t)if(beats(x.c,b.c))b=x;return b}
function legal(s){const h=H[s];if(!trick.length)return h;const l=trick[0].c.s;const f=h.filter(c=>c.s===l);return f.length?f:h}
function sortH(h){h.sort((a,b)=>a.s-b.s||b.r-a.r)}
const cname=c=>lab(c)+' '+SN[c.s];
function log(t){const L=$('log'),d=document.createElement('div');d.textContent=t;L.appendChild(d);setTimeout(()=>{if(d.remove)d.remove()},6000);while(L.children&&L.children.length>12)L.removeChild(L.firstChild);L.scrollTop=L.scrollHeight}
function handText(){const o=[];for(let x=0;x<4;x++){const a=H[0].filter(c=>c.s===x).sort((p,q)=>q.r-p.r);if(a.length)o.push(SN[x]+': '+a.map(lab).join('، '))}return o.join('؛ ')}
function readHand(){log('کارت‌های شما: '+handText()+'.')}
function readTrump(){log(trump==null?'حکم هنوز انتخاب نشده. ':'حکم: '+SN[trump]+'. ');log('حاکم: '+NM[hakem]+'.')}
function readTable(){const dt=trick.length?trick:shown;log(dt.length?'روی زمین: '+dt.map(t=>NM[t.seat]+' '+cname(t.c)).join('، ')+'.':'روی زمین کارتی نیست.')}
function readLed(){log(trick.length?'خال زمین: '+SN[trick[0].c.s]+'.':'کسی هنوز کارتی نیاورده، هر خالی می‌توانید بیاورید.')}
function readLegal(){if(phase==='play'&&turn===0&&!waiting){const L=legal(0).slice().sort((a,b)=>a.s-b.s||b.r-a.r);log('کارت‌های مجاز شما: '+L.map(cname).join('، ')+'.')}else log('الان نوبت شما نیست.')}
function readTurn(){log(phase!=='play'?'بازی در حال انجام نیست.':turn===0?'نوبت شماست.':'نوبت '+NM[turn]+' است.')}
function readTricks(){log('دست‌های این دور: تیم شما '+tk[0]+'، حریف '+tk[1]+'.')}
function readScore(){log('امتیاز بازی: تیم شما '+sc[0]+'، حریف '+sc[1]+'. هر تیم زودتر به ۷ برسد برنده است.')}
function readAll(){readTrump();readTricks();readScore();readTable();readHand();readTurn()}
function focusFirst(sel){const b=document.querySelector&&document.querySelector(sel);if(b)b.focus()}
function newHand(){$('log').innerHTML='';
 deck=[];for(let s=0;s<4;s++)for(let r=2;r<=14;r++)deck.push({s,r});
 for(let i=51;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
 H=[[],[],[],[]];trump=null;trick=[];tk=[0,0];seen=new Set();voids=[new Set(),new Set(),new Set(),new Set()];winSeat=-1;lastTrick=[];shown=[];plays=[];waiting=false;$('ctl').innerHTML='';
 // سه‌تایی/پنج کارت اول برای حاکم
 for(let i=0;i<4;i++)for(let k=0;k<5;k++)H[i].push(deck.pop());
 phase='pick';render();$('log').innerHTML='';log('دور جدید شروع شد. حاکم: '+NM[hakem]+'.');
 if(hakem===0){say('شما حاکم هستید. با دیدن ۵ کارت اول، خال حکم را انتخاب کنید.');showPick();log('شما حاکم هستید. پنج کارت اول شما: '+handText()+'. حکم را انتخاب کنید.');focusFirst('.pick button')}
 else{say(NM[hakem]+' حاکم است و حکم را انتخاب می‌کند...');setTimeout(()=>{
  if(phase==='pick'&&trump==null)setTrump(chooseTrump(hakem))},1200)}
}
function showPick(){const m=$('hand');m.innerHTML='';const d=document.createElement('div');d.className='pick';
 d.innerHTML='<div>حکم را انتخاب کنید:</div>'+SU.map((x,i)=>`<button class="btn ${i==1||i==2?'r':''}" aria-label="حکم ${SN[i]}" onclick="setTrump(${i})">${x}<small style="font-size:12px"> ${SN[i]}</small></button>`).join('');
 $('hand').appendChild(d);renderHandOnly(true)}
function setTrump(s){
 trump=s;log('حکم: '+SN[s]+(hakem===0?'.':' (انتخاب '+NM[hakem]+').'));for(let i=0;i<4;i++)while(H[i].length<13)H[i].push(deck.pop());
 H.forEach(sortH);log('کارت‌های شما: '+handText()+'.');phase='play';turn=hakem;trick=[];render();next()}
function next(){
 render();if(phase!=='play')return;
 if(turn===0){
  say('نوبت شماست.');
  log('نوبت شماست. '+(trick.length?'خال زمین: '+SN[trick[0].c.s]+'.':'شما شروع می‌کنید.'));
  focusFirst('#hand button.ok');return}
 say('نوبت '+NM[turn]+'...');busy=true;setTimeout(()=>{busy=false;botPlay(turn)},shown.length?1800:800);
}
const sid=i=>Math.floor(i/20);
const beatsI=(a,b)=>sid(a)===sid(b)?a%20>b%20:sid(a)===trump;
let nodes=0,lim=0;
function pts(t,team){const w=t[0]>=7?0:t[1]>=7?1:-1;if(w<0)return null;const p=t[1-w]===0?(w===hakem%2?2:3):1;return w===team?p:-p}
function sv(hh,trk,turn,t,team,al,be){
 if(++nodes>lim)throw 0;
 if(trk.length===4){let b=trk[0];for(const x of trk)if(beatsI(x.id,b.id))b=x;const t2=[t[0],t[1]];t2[b.seat%2]++;const p=pts(t2,team);if(p!==null)return p;t=t2;turn=b.seat;trk=[]}
 const hand=hh[turn],led=trk.length?sid(trk[0].id):-1;
 let L=hand;if(led>=0){const f=hand.filter(i=>sid(i)===led);if(f.length)L=f}
 if(!L.length)return 0;
 const vv=i=>(sid(i)===trump?100:0)+i%20;
 L=L.slice().sort((a,b)=>vv(b)-vv(a));
 const mx=turn%2===team;let best=mx?-9:9;
 for(const id of L){
  hh[turn]=hand.filter(i=>i!==id);
  const v=sv(hh,trk.concat([{seat:turn,id}]),(turn+1)%4,t,team,al,be);
  hh[turn]=hand;
  if(mx){if(v>best)best=v;if(best>al)al=best}else{if(v<best)best=v;if(best<be)be=best}
  if(al>=be)break;
 }
 return best;
}
function evalExact(hs,s,c){
 const hh=hs.map(a=>a.map(x=>x.s*20+x.r)),id=c.s*20+c.r;
 hh[s]=hh[s].filter(i=>i!==id);
 const trk=trick.map(t=>({seat:t.seat,id:t.c.s*20+t.c.r})).concat([{seat:s,id}]);
 nodes=0;lim=5000;
 try{return sv(hh,trk,(s+1)%4,[tk[0],tk[1]],s%2,-9,9)}catch(e){return null}
}
function weightOf(hs,s){
 let w=1;
 for(let i=0;i<plays.length;i++){
  const e=plays[i],X=e.seat;if(X===s||e.len===0)continue;
  const hand=hs[X].concat(plays.slice(i).filter(p=>p.seat===X).map(p=>p.c));
  if(e.c.s===e.led){
   const pwin=(X+2)%4===e.bs,wins=!pwin&&beats(e.c,e.bc);
   if(hand.some(c=>c.s===e.led&&c.r<e.c.r&&(wins?beats(c,e.bc):true)))w*=X===0?0.6:0.3;
  }else if(e.c.s!==trump&&(X+2)%4!==e.bs&&hand.some(c=>c.s===trump&&beats(c,e.bc)))w*=X===0?0.5:0.2;
 }
 return w;
}
function full(h0,hk){
 const hh=h0.map(a=>a.slice());const t=[0,0];let trk=[],turn=hk;
 for(;;){
  if(trk.length===4){const w=bestOf(trk).seat;t[w%2]++;trk=[];turn=w;const p=pts(t,hk%2);if(p!==null)return p}
  const pc=rp(hh[turn],turn,trk);hh[turn]=hh[turn].filter(x=>x!==pc);trk.push({seat:turn,c:pc});
  if(trk.length<4)turn=(turn+1)%4;
 }
}
function chooseTrump(hk){
 const mine=H[hk].slice(),own=new Set(mine.map(c=>c.s*20+c.r)),un=[];
 for(let x=0;x<4;x++)for(let r=2;r<=14;r++)if(!own.has(x*20+r))un.push({s:x,r});
 const sc3=[0,0,0,0],old=trump;
 for(let n=0;n<150;n++){
  const pool=un.slice();for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const hs=[0,1,2,3].map(o=>o===hk?mine.concat(pool.splice(0,8)):pool.splice(0,13));
  for(let x=0;x<4;x++){trump=x;sc3[x]+=full(hs,hk)}
 }
 trump=old;let b=0;sc3.forEach((v,i)=>{if(v>sc3[b])b=i});return b;
}
function rp(hand,seat,trk){
 const led=trk.length?trk[0].c.s:-1;let L=hand;
 if(led>=0){const f=hand.filter(c=>c.s===led);if(f.length)L=f}
 if(!trk.length){let b=null,bv=-99;for(const c of hand){const v=c.r+(c.s===trump?-50:0);if(v>bv){bv=v;b=c}}return b}
 const b=bestOf(trk);let lc=L[0];for(const c of L)if(val(c)<val(lc))lc=c;
 if(b.seat%2===seat%2)return lc;
 let w=null;for(const c of L)if(beats(c,b.c)&&(!w||val(c)<val(w)))w=c;
 return w||lc;
}
function rollout(h0,s,c){
 const hh=h0.map(a=>a.slice());hh[s]=hh[s].filter(x=>x!==c);
 const t=[tk[0],tk[1]];let trk=trick.slice();trk.push({seat:s,c});let turn=(s+1)%4;
 for(;;){
  if(trk.length===4){const w=bestOf(trk).seat;t[w%2]++;trk=[];turn=w;const pp=pts(t,s%2);if(pp!==null)return pp}
  if(!hh[turn].length)break;
  const pc=rp(hh[turn],turn,trk);hh[turn]=hh[turn].filter(x=>x!==pc);trk.push({seat:turn,c:pc});
  if(trk.length<4)turn=(turn+1)%4;
 }
 return pts(t,s%2)||0;
}
function botPlay(s){
 const h=H[s],L=legal(s);let C=L;
 if(trick.length){
  const b=bestOf(trick);
  if(b.seat===(s+2)%4){
   const has=(x,r)=>seen.has(x*20+r)||h.some(c=>c.s===x&&c.r===r);
   let ut=0;for(let r=2;r<=14;r++)if(!has(trump,r))ut++;
   const oa=[(s+1)%4,(s+3)%4].filter(o=>!trick.some(t=>t.seat===o));
   const threat=c=>oa.some(o=>{
    if(c.s===trump){for(let r=c.r+1;r<=14;r++)if(!has(trump,r))return true;return false}
    if(voids[o].has(c.s))return ut>0;
    for(let r=c.r+1;r<=14;r++)if(!has(c.s,r))return true;
    return false});
   const keep=L.filter(c=>!beats(c,b.c));
   if(keep.length){
    const rescue=threat(b.c)?L.filter(c=>beats(c,b.c)&&c.s===b.c.s&&!threat(c)):[];
    C=keep.concat(rescue);
   }
  }
 }
 const hasC=(x,r)=>seen.has(x*20+r)||h.some(c=>c.s===x&&c.r===r);
 const isMaster=c=>{for(let r=c.r+1;r<=14;r++)if(!hasC(c.s,r))return false;return true};
 let utc=0;for(let r=2;r<=14;r++)if(!hasC(trump,r))utc++;
 const opps2=[(s+1)%4,(s+3)%4];
 const ruffer=x=>x!==trump&&utc>0&&opps2.some(o=>!voids[o].has(trump)&&voids[o].has(x));
 const lowPlay=()=>{
  const mn=(a,f)=>a.reduce((m,c)=>f(c)<f(m)?c:m);
  if(trick.length&&L[0].s===trick[0].c.s)return mn(L,c=>c.r);
  const nt=L.filter(c=>c.s!==trump);
  if(!nt.length)return mn(L,c=>c.r);
  const D=[];for(let x=0;x<4;x++){if(x===trump)continue;const a=nt.filter(c=>c.s===x);if(a.length)D.push(mn(a,c=>c.r))}
  const good=D.filter(c=>c.r<12&&!isMaster(c));
  return mn(good.length?good:D,c=>c.r+(h.filter(z=>z.s===c.s).length)/100);
 };
 if(trick.length===3){
  const best=bestOf(trick),pw=best.seat===(s+2)%4,led=trick[0].c.s;
  const mn=(a,f)=>a.reduce((m,c)=>f(c)<f(m)?c:m);
  const win=pw?[]:L.filter(c=>beats(c,best.c));
  let pk;
  if(win.length)pk=mn(win,val);
  else if(L[0].s===led)pk=mn(L,c=>c.r);
  else{
   const nt=L.filter(c=>c.s!==trump);
   if(nt.length){
    let D=[];for(let x=0;x<4;x++){if(x===trump)continue;const a=nt.filter(c=>c.s===x);if(a.length)D.push(mn(a,c=>c.r))}
    const good=D.filter(c=>c.r<12&&!isMaster(c));
    pk=mn(good.length?good:D,c=>c.r+(h.filter(z=>z.s===c.s).length)/100);
   }else pk=mn(L,c=>c.r);
  }
  play(s,pk);return;
 }
 if(trick.length){
  const best=bestOf(trick),led=trick[0].c.s;
  if(L[0].s===led){
   const win=C.filter(c=>beats(c,best.c)),lc=C.reduce((m,c)=>c.r<m.r?c:m);
   C=win.includes(lc)?win:win.concat([lc]);
   if(led!==trump&&utc>0&&opps2.some(o=>!trick.some(t=>t.seat===o)&&!voids[o].has(trump)&&voids[o].has(led)))C=[lc];
  }else{
   const T=C.filter(c=>c.s===trump&&beats(c,best.c));let D=[];
   for(let x=0;x<4;x++){if(x===trump)continue;const a=C.filter(c=>c.s===x);if(a.length)D.push(a.reduce((m,c)=>c.r<m.r?c:m))}
   const good=D.filter(c=>c.r<12&&!isMaster(c));
   if(good.length)D=good;else if(D.length)D=[D.reduce((m,c)=>c.r<m.r?c:m)];
   const pw=best.seat===(s+2)%4;
   C=(pw&&D.length?[]:T).concat(D);if(!C.length)C=[L.reduce((m,c)=>c.r<m.r?c:m)];
  }
 }
 if(!trick.length){
  let ut=0;for(let r=2;r<=14;r++)if(!hasC(trump,r))ut++;
  const op=[(s+1)%4,(s+3)%4];
  const tops=L.filter(c=>c.s!==trump&&isMaster(c)&&(ut===0||!op.some(o=>voids[o].has(c.s))));
  if(tops.length)C=tops;
  const okc=C.filter(c=>!ruffer(c.s));if(okc.length)C=okc;
 }
 if(!trick.length&&h.length>5){
  let ut2=0;for(let r=2;r<=14;r++)if(!hasC(trump,r))ut2++;
  const op2=[(s+1)%4,(s+3)%4];
  const safe=C.filter(c=>c.s===trump||!(ut2>0&&op2.some(o=>voids[o].has(c.s)&&!voids[o].has(trump))));
  if(safe.length)C=safe;
 }
 if(h.length<=5&&!trick.length)C=L;
 C=C.filter(c=>!C.some(d=>d.s===c.s&&d.r<c.r&&(()=>{for(let r=d.r+1;r<c.r;r++)if(!hasC(c.s,r))return false;return true})()));
 let pick=C[0];
 if(C.length>1){
  const un=[];for(let x=0;x<4;x++)for(let r=2;r<=14;r++)if(!seen.has(x*20+r)&&!h.some(c=>c.s===x&&c.r===r))un.push({s:x,r});
  const others=[0,1,2,3].filter(o=>o!==s).sort((a,b)=>voids[b].size-voids[a].size);
  const cand=C.slice().sort((a,b)=>val(a)-val(b)),sc2=cand.map(()=>0),ex5=h.length<=5,N=ex5?30:(h.length>9?700:1200);
  for(let n=0;n<N;n++){
   const pool=un.slice();for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
   const hs=[[],[],[],[]];hs[s]=h.slice();
   for(const o of others){const need=H[o].length,ok=[],bad=[];
    for(const c of pool)(voids[o].has(c.s)?bad:ok).push(c);
    const take=ok.slice(0,need);if(take.length<need)take.push(...bad.slice(0,need-take.length));
    hs[o]=take;const ts=new Set(take);for(let i=pool.length-1;i>=0;i--)if(ts.has(pool[i]))pool.splice(i,1)}
   const w=weightOf(hs,s);cand.forEach((c,i)=>{let v=null;if(ex5)v=evalExact(hs,s,c);if(v===null)v=rollout(hs,s,c);sc2[i]+=w*(v-0.06*(c.r/14+(c.s===trump?0.3:0)))});
  }
  let bi=0;sc2.forEach((v,i)=>{if(v>sc2[bi])bi=i});pick=cand[bi];
 }
 if(trick.length&&!beats(pick,bestOf(trick).c))pick=lowPlay();
 play(s,pick);
}
function play(s,c){
 shown=[];if(!trick.length)$('log').innerHTML='';log((s===0?'شما':NM[s])+' '+cname(c)+' بازی کرد'+(c.s===trump?' (حکم).':'.'));{const bb=trick.length?bestOf(trick):null;plays.push({seat:s,c,len:trick.length,led:trick.length?trick[0].c.s:-1,bs:bb?bb.seat:-1,bc:bb?bb.c:null})}if(trick.length&&c.s!==trick[0].c.s)voids[s].add(trick[0].c.s);seen.add(c.s*20+c.r);H[s]=H[s].filter(x=>x!==c);trick.push({seat:s,c});render();
 if(trick.length<4){turn=(s+1)%4;next();return}
 const w=bestOf(trick).seat;tk[w%2]++;winSeat=w;lastTrick=trick.slice();shown=trick.slice();trick=[];turn=w;render();
 if(tk[0]===7||tk[1]===7){endHand();return}
 render();
 const wm=NM[w]+' این دست را برد. دست‌های این دور: تیم شما '+tk[0]+'، حریف '+tk[1]+'.';say(wm);log(wm);next();
}
function endHand(){
 const t=tk[0]===7?0:1,o=1-t,hk=hakem%2;
 const kot=tk[o]===0,pts=kot?(t===hk?2:3):1;
 sc[t]+=pts;phase='end';render();
 const gm=sc[t]>=7;
 let m=(t===0?'تیم شما و یار':'تیم حریف')+' این دست را برد'+(kot?(t===hk?' (کوت! ۲ امتیاز)':' (حاکم‌کوت! ۳ امتیاز)'):' (۱ امتیاز)')+'. ';
 if(t!==hk)hakem=(hakem+1)%4;
 if(gm)m=(t===0?'🎉 شما و یارتان بازی را بردید!':'تیم حریف بازی را برد.');
 $('msg').innerHTML=m+'<br><button class="btn" onclick="'+(gm?'sc=[0,0];':'')+'newHand()">'+(gm?'بازی جدید':'دست بعد')+'</button>';log(m);focusFirst('#msg button');
}
function showLast(){if(!lastTrick.length){log('هنوز دستی بازی نشده.');return}log('دست قبل: '+lastTrick.map(t=>NM[t.seat]+' '+cname(t.c)).join('، ')+'. برنده: '+NM[winSeat]+'.')}
function say(t){$('msg').textContent=t}
function fig(r,red){
 const sk='#f1c9a0',gd='#e0a82e',rb=red?'#b8242b':'#243b6b',dk='#2b1d14';
 let b=r===12?`<path d="M10 17 Q9 40 14 38 L26 38 Q31 40 30 17Z" fill="${dk}"/>`:'';
 b+=`<path d="M6 40 Q7 25 20 25 Q33 25 34 40Z" fill="${rb}"/><path d="M16 26 L20 33 L24 26" fill="${gd}"/>`;
 b+=`<circle cx="20" cy="17" r="7" fill="${sk}"/><circle cx="17.5" cy="16.5" r="1" fill="#222"/><circle cx="22.5" cy="16.5" r="1" fill="#222"/>`;
 if(r===13)b+=`<path d="M13 21 Q20 35 27 21 Q20 26 13 21Z" fill="#333"/><path d="M12 11 L12.5 3 L16.5 7.5 L20 1 L23.5 7.5 L27.5 3 L28 11Z" fill="${gd}" stroke="#a77a10" stroke-width=".6"/><circle cx="20" cy="5.5" r="1.3" fill="${rb}"/>`;
 else if(r===12)b+=`<path d="M17 21.5 Q20 23 23 21.5" stroke="#b33" stroke-width="1.2" fill="none"/><path d="M12.5 12 L14.5 6.5 L17.5 10 L20 4.5 L22.5 10 L25.5 6.5 L27.5 12Z" fill="${gd}" stroke="#a77a10" stroke-width=".6"/>`;
 else b+=`<path d="M15.5 21 Q20 19 24.5 21" stroke="#333" fill="none" stroke-width="1.4"/><path d="M13 11.5 Q13 3 20 3 Q27 3 27 11.5Z" fill="#3a5a9a"/><rect x="12.5" y="10.5" width="15" height="2.4" fill="${gd}"/><path d="M34 22 L37 38" stroke="#aaa" stroke-width="2.2"/>`;
 return `<svg viewBox="0 0 40 40" width="34" height="34">${b}</svg>`;
}
function cardHTML(c){
 const red=c.s===1||c.s===2;
  if(c.r===14)return '<span>'+lab(c)+'</span><span style="font-size:30px;line-height:1">'+SU[c.s]+'</span><span class="sn">'+SN[c.s]+'</span>';
 return '<span>'+lab(c)+'</span><span class="sy">'+SU[c.s]+'</span><span class="sn">'+SN[c.s]+'</span>';
}
function cardEl(c,btn){const e=document.createElement(btn?'button':'div');e.className='card'+(c.s===1||c.s===2?' r':'');e.innerHTML=cardHTML(c);return e}
function renderHandOnly(pickMode){
 const h=$('hand');if(!pickMode)h.innerHTML='';
 const w=document.createElement('div');w.style.cssText='display:flex;flex-wrap:wrap;justify-content:center;gap:4px';
 const L=(phase==='play'&&turn===0&&!busy&&!waiting)?legal(0):[];
 H[0].forEach(c=>{const e=cardEl(c,true);e.setAttribute('aria-label',cname(c)+(c.s===trump?'، حکم':'')+(L.includes(c)?'':'، قابل بازی نیست'));if(L.includes(c)){e.classList.add('ok');e.onclick=()=>{if(turn===0&&!busy&&!waiting&&phase==='play')play(0,c)}}else e.disabled=true;w.appendChild(e)});
 h.appendChild(w);
}
function render(){
 $('tr').textContent=trump==null?'—':SU[trump]+' '+SN[trump];$('tr').style.color=(trump===1||trump===2)?'#e34':'';
 $('hk').textContent=NM[hakem];$('sc0').textContent=sc[0];$('sc1').textContent=sc[1];
 $('tk0').textContent=tk[0];$('tk1').textContent=tk[1];
 for(let i=0;i<4;i++){const p=$('p'+i);p.className=(p.className.replace(' act','')+(phase==='play'&&turn===i?' act':''));
  const bk=i?'<div>'+'<span class="back"></span>'.repeat(Math.min(H[i].length,5))+'</div>':'';
  p.innerHTML=`<span class="n">${NM[i]}${i===hakem?' 👑':''} · ${H[i].length}</span>${bk}`}
 const m=$('mid');m.innerHTML='';
 (trick.length?trick:shown).forEach(t=>{const d=document.createElement('div');d.className='slot s'+t.seat+(!trick.length&&t.seat===winSeat?' win':'');d.appendChild(cardEl(t.c));m.appendChild(d)});
 if(phase!=='pick')renderHandOnly();
}
newHand();
